name: Update tracking

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages.json"
      - "scripts/**"
      - ".github/workflows/update-tracking.yml"

concurrency:
  group: update-tracking
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Fetch tracking data
        run: node scripts/fetch-tracking.mjs

      - name: Email the family about arrivals and deliveries
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: node scripts/notify.mjs

      - name: Commit if changed
        # Runs even when the email step failed, so a mail outage cannot freeze the site.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/tracking.json state/notified.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update tracking data"
          # A scheduled run can race a push; rebase and retry rather than fail.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "Could not push tracking update after 3 attempts." >&2
          exit 1
