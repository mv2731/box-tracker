<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Our Boxes</title>
<style>
  :root {
    color-scheme: light;
    --page:           #fbf7f1;
    --surface:        #ffffff;
    --text-primary:   #221f1b;
    --text-secondary: #5b554c;
    --muted:          #918a7e;
    --grid:           #ece5da;
    --border:         rgba(34,31,27,0.10);
    --progress:       #2a78d6;
    --good:           #0ca30c;
    --critical:       #d03b3b;
    --shadow:         0 1px 2px rgba(80,60,40,0.05), 0 6px 18px rgba(80,60,40,0.06);

    /* header illustration, daytime */
    --sky-1: #cfeafc;  --sky-2: #ffe7c9;   --sun: #ffcf5c;
    --cloud: #ffffff;  --ground: #cfe9c0;  --hill: #b7ddaa;
    --brick-1: #dd9068; --brick-2: #c8764f; --brick-3: #e5a67e;
    --brick-trim: #b4634a; --window: #ffe6a1; --door: #8c5237;
    --route: rgba(255,255,255,0.95);
    --truck-body: #fdfaf4; --truck-cab: #ef8a5e; --truck-glass: #c2e4f6;
    --wheel-hub: #fdfaf4; --ink: #3d3730;
    --box-face: #e9bb84; --box-face-2: #ddaa72; --box-lid: #d5a061; --box-tape: #f7ead3;
    --trunk: #a9784f; --frond: #55b365; --coconut: #7d5a3c;
    --star-opacity: 0; --sun-opacity: 1;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:           #100f0e;
      --surface:        #1c1b19;
      --text-primary:   #f7f4ef;
      --text-secondary: #c6bfb3;
      --muted:          #8e887d;
      --grid:           #302e2a;
      --border:         rgba(255,255,255,0.10);
      --progress:       #3987e5;
      --shadow:         none;

      /* header illustration, dusk */
      --sky-1: #1b2444;  --sky-2: #462f4d;  --sun: transparent;
      --cloud: rgba(255,255,255,0.09); --ground: #23301f; --hill: #2b3b2a;
      --brick-1: #7d4d3a; --brick-2: #68402f; --brick-3: #8a5741;
      --brick-trim: #5c382c; --window: #ffd98a; --door: #462c21;
      --route: rgba(255,255,255,0.42);
      --truck-body: #efe9df; --truck-cab: #d9764c; --truck-glass: #8fb9cf;
      --wheel-hub: #efe9df; --ink: #23211d;
      --box-face: #c39a68; --box-face-2: #b78c5c; --box-lid: #a97c4c; --box-tape: #e0cba9;
      --trunk: #7c573a; --frond: #3f8a4c; --coconut: #5d4430;
      --star-opacity: 1; --sun-opacity: 0;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:           #100f0e;
    --surface:        #1c1b19;
    --text-primary:   #f7f4ef;
    --text-secondary: #c6bfb3;
    --muted:          #8e887d;
    --grid:           #302e2a;
    --border:         rgba(255,255,255,0.10);
    --progress:       #3987e5;
    --shadow:         none;

    --sky-1: #1b2444;  --sky-2: #462f4d;  --sun: transparent;
    --cloud: rgba(255,255,255,0.09); --ground: #23301f; --hill: #2b3b2a;
    --brick-1: #7d4d3a; --brick-2: #68402f; --brick-3: #8a5741;
    --brick-trim: #5c382c; --window: #ffd98a; --door: #462c21;
    --route: rgba(255,255,255,0.42);
    --truck-body: #efe9df; --truck-cab: #d9764c; --truck-glass: #8fb9cf;
    --wheel-hub: #efe9df; --ink: #23211d;
    --box-face: #c39a68; --box-face-2: #b78c5c; --box-lid: #a97c4c; --box-tape: #e0cba9;
    --trunk: #7c573a; --frond: #3f8a4c; --coconut: #5d4430;
    --star-opacity: 1; --sun-opacity: 0;
  }

  /* ---- header illustration ---- */
  .hero {
    border-radius: 18px; overflow: hidden; margin-bottom: 20px;
    box-shadow: var(--shadow); border: 1px solid var(--border);
    aspect-ratio: 1000 / 250;
  }
  .hero svg { display: block; width: 100%; height: 100%; }
  .hero .sun { opacity: var(--sun-opacity); }
  .hero .stars { opacity: var(--star-opacity); }
  .hero .route-line { animation: roll 2.4s linear infinite; }
  @keyframes roll { to { stroke-dashoffset: -18; } }
  @media (prefers-reduced-motion: reduce) {
    .hero .route-line { animation: none; }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }

  header { margin-bottom: 28px; }
  h1 { font-size: 2rem; margin: 0 0 6px; letter-spacing: -0.025em; }
  .route {
    color: var(--text-secondary); font-size: 0.95rem; margin: 0 0 4px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .route .arrow { color: var(--muted); }
  .updated { color: var(--muted); font-size: 0.82rem; margin: 0; }

  /* ---- summary tiles ---- */
  .tiles {
    display: grid; gap: 12px; margin: 24px 0 28px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
  .tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow);
  }
  .tile .label {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin-bottom: 6px;
  }
  .tile .value { font-size: 1.65rem; font-weight: 650; letter-spacing: -0.02em; }
  .tile .sub { font-size: 0.82rem; color: var(--text-secondary); margin-top: 2px; }

  /* ---- cards ---- */
  .cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 14px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 3px 6px rgba(80,60,40,0.07), 0 12px 28px rgba(80,60,40,0.09); }
  @media (prefers-reduced-motion: reduce) { .card, .card:hover { transition: none; transform: none; } }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .nickname { font-size: 1.1rem; font-weight: 650; margin: 0; }
  .tracking {
    font-size: 0.78rem; color: var(--muted);
    font-variant-numeric: tabular-nums; margin-top: 2px;
  }
  .tracking a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  .tracking a:hover { color: var(--text-secondary); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-size: 0.78rem; font-weight: 600; padding: 4px 10px;
    border-radius: 999px; border: 1px solid currentColor; white-space: nowrap;
  }
  .chip svg { width: 13px; height: 13px; flex-shrink: 0; }

  /* ---- progress meter ---- */
  .meter { display: flex; gap: 2px; }
  .seg { flex: 1; height: 7px; background: var(--grid); border-radius: 1px; }
  .seg:first-child { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
  .seg:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
  .seg.on { background: var(--progress); }
  .seg.done { background: var(--good); }
  .seg.bad { background: var(--critical); }
  .stages {
    display: flex; gap: 2px; margin-top: 6px;
    font-size: 0.68rem; color: var(--muted);
  }
  .stages span { flex: 1; }
  .stages span:nth-child(2), .stages span:nth-child(3) { text-align: center; }
  .stages span:last-child { text-align: right; }
  .stages span.cur { color: var(--text-primary); font-weight: 650; }

  /* ---- current location ---- */
  .now { border-top: 1px solid var(--grid); padding-top: 12px; }
  .now .where { font-size: 1rem; font-weight: 600; margin-bottom: 2px; }
  .now .what { font-size: 0.88rem; color: var(--text-secondary); }
  .now .when { font-size: 0.78rem; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .eta-line { font-size: 0.85rem; color: var(--text-secondary); margin-top: 8px; }
  .eta-line b { color: var(--text-primary); font-weight: 650; }

  /* ---- timeline ---- */
  details { border-top: 1px solid var(--grid); padding-top: 10px; margin-top: auto; }
  summary {
    cursor: pointer; font-size: 0.82rem; color: var(--text-secondary);
    list-style: none; user-select: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; color: var(--muted); }
  details[open] summary::before { content: "▾ "; }
  summary:hover { color: var(--text-primary); }
  .events { margin: 12px 0 2px; padding: 0; list-style: none; }
  .events li {
    display: grid; grid-template-columns: 108px 1fr; gap: 10px;
    padding: 7px 0; border-top: 1px solid var(--grid); font-size: 0.82rem;
  }
  .events li:first-child { border-top: none; }
  .events time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .events .msg { color: var(--text-primary); }
  .events .loc { color: var(--text-secondary); font-size: 0.78rem; }

  /* ---- table view ---- */
  .toolbar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  button.toggle {
    font: inherit; font-size: 0.82rem; cursor: pointer;
    background: var(--surface); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px;
  }
  button.toggle:hover { color: var(--text-primary); }
  .table-wrap { overflow-x: auto; margin-top: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; background: var(--surface); }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums; }
  td.scan { white-space: normal; min-width: 240px; max-width: 340px; }
  [hidden] { display: none !important; }

  .banner {
    border: 1px solid var(--critical); color: var(--critical);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; font-size: 0.88rem;
  }
  footer {
    margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--grid);
    font-size: 0.78rem; color: var(--muted);
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hero">
      <svg viewBox="0 0 1000 250" role="img" aria-label="Illustration of boxes travelling from Brooklyn brownstones to California palm trees" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--sky-1)"/>
            <stop offset="100%" stop-color="var(--sky-2)"/>
          </linearGradient>
          <clipPath id="round"><rect x="0" y="0" width="1000" height="250" rx="18"/></clipPath>
        </defs>

        <g clip-path="url(#round)">
          <rect width="1000" height="250" fill="url(#sky)"/>

          <!-- sun by day, moon and stars by night -->
          <circle class="sun" cx="828" cy="58" r="27" fill="var(--sun)"/>
          <g class="stars" fill="#fff8e7">
            <circle cx="120" cy="42" r="2"/><circle cx="250" cy="28" r="1.6"/>
            <circle cx="410" cy="52" r="2.2"/><circle cx="560" cy="30" r="1.5"/>
            <circle cx="690" cy="46" r="2"/><circle cx="930" cy="70" r="1.7"/>
            <circle cx="350" cy="88" r="1.4"/><circle cx="620" cy="92" r="1.5"/>
          </g>

          <!-- clouds -->
          <g fill="var(--cloud)">
            <g transform="translate(150 62)">
              <rect x="0" y="8" width="86" height="20" rx="10"/>
              <circle cx="26" cy="12" r="15"/><circle cx="52" cy="15" r="12"/>
            </g>
            <g transform="translate(560 44)" opacity="0.85">
              <rect x="0" y="8" width="70" height="17" rx="8.5"/>
              <circle cx="22" cy="11" r="13"/><circle cx="46" cy="13" r="10"/>
            </g>
          </g>

          <!-- ground -->
          <rect y="196" width="1000" height="54" fill="var(--ground)"/>
          <ellipse cx="880" cy="205" rx="180" ry="26" fill="var(--hill)"/>

          <!-- Brooklyn brownstones -->
          <g class="city">
            <g>
              <rect x="52" y="96" width="66" height="102" rx="6" fill="var(--brick-1)"/>
              <rect x="46" y="88" width="78" height="14" rx="5" fill="var(--brick-trim)"/>
              <g fill="var(--window)"><rect x="64" y="112" width="16" height="20" rx="3"/><rect x="90" y="112" width="16" height="20" rx="3"/><rect x="64" y="146" width="16" height="20" rx="3"/><rect x="90" y="146" width="16" height="20" rx="3"/></g>
              <rect x="76" y="176" width="20" height="22" rx="4" fill="var(--door)"/>
            </g>
            <g>
              <rect x="132" y="72" width="60" height="126" rx="6" fill="var(--brick-2)"/>
              <rect x="126" y="64" width="72" height="14" rx="5" fill="var(--brick-trim)"/>
              <g fill="var(--window)"><rect x="144" y="90" width="15" height="19" rx="3"/><rect x="167" y="90" width="15" height="19" rx="3"/><rect x="144" y="122" width="15" height="19" rx="3"/><rect x="167" y="122" width="15" height="19" rx="3"/></g>
              <rect x="152" y="176" width="20" height="22" rx="4" fill="var(--door)"/>
            </g>
            <g>
              <rect x="206" y="110" width="58" height="88" rx="6" fill="var(--brick-3)"/>
              <rect x="200" y="102" width="70" height="13" rx="5" fill="var(--brick-trim)"/>
              <g fill="var(--window)"><rect x="218" y="126" width="15" height="18" rx="3"/><rect x="240" y="126" width="15" height="18" rx="3"/></g>
              <rect x="226" y="176" width="20" height="22" rx="4" fill="var(--door)"/>
            </g>
          </g>

          <!-- dashed route -->
          <path class="route-line" d="M 285 172 Q 520 78 760 172" fill="none" stroke="var(--route)"
                stroke-width="4" stroke-linecap="round" stroke-dasharray="2 16"/>

          <!-- little truck carrying a box, riding the route -->
          <g transform="translate(468 96)">
            <g transform="translate(14 -26)">
              <rect x="0" y="0" width="34" height="30" rx="5" fill="var(--box-face)"/>
              <rect x="0" y="0" width="34" height="9" rx="4" fill="var(--box-lid)"/>
              <path d="M17 0 v30" stroke="var(--box-tape)" stroke-width="3"/>
              <circle cx="10" cy="18" r="1.9" fill="var(--ink)"/>
              <circle cx="24" cy="18" r="1.9" fill="var(--ink)"/>
              <path d="M11 24 q6 5 12 0" stroke="var(--ink)" stroke-width="2" fill="none" stroke-linecap="round"/>
            </g>
            <rect x="0" y="4" width="62" height="34" rx="7" fill="var(--truck-body)"/>
            <path d="M62 14 h18 l14 15 v9 h-32 z" fill="var(--truck-cab)"/>
            <rect x="66" y="17" width="16" height="12" rx="3" fill="var(--truck-glass)"/>
            <circle cx="18" cy="42" r="9" fill="var(--ink)"/><circle cx="18" cy="42" r="3.6" fill="var(--wheel-hub)"/>
            <circle cx="76" cy="42" r="9" fill="var(--ink)"/><circle cx="76" cy="42" r="3.6" fill="var(--wheel-hub)"/>
          </g>

          <!-- California palms -->
          <g class="palms">
            <g transform="translate(806 92)">
              <path d="M10 106 q-7 -56 3 -84" stroke="var(--trunk)" stroke-width="9" fill="none" stroke-linecap="round"/>
              <g transform="translate(13 22)" fill="var(--frond)">
                <g>
                  <path d="M0 0 Q20 -7 37 7 Q18 -1 0 4 Z" transform="rotate(-34)"/>
                  <path d="M0 0 Q20 -7 37 7 Q18 -1 0 4 Z" transform="rotate(3)"/>
                  <path d="M0 0 Q20 -7 37 7 Q18 -1 0 4 Z" transform="rotate(40)"/>
                </g>
                <g transform="scale(-1,1)">
                  <path d="M0 0 Q20 -7 37 7 Q18 -1 0 4 Z" transform="rotate(-30)"/>
                  <path d="M0 0 Q20 -7 37 7 Q18 -1 0 4 Z" transform="rotate(6)"/>
                  <path d="M0 0 Q20 -7 37 7 Q18 -1 0 4 Z" transform="rotate(43)"/>
                </g>
              </g>
              <circle cx="13" cy="22" r="4.5" fill="var(--coconut)"/>
            </g>
            <g transform="translate(892 116)">
              <path d="M8 82 q-6 -44 2 -64" stroke="var(--trunk)" stroke-width="7" fill="none" stroke-linecap="round"/>
              <g transform="translate(10 18)" fill="var(--frond)">
                <g>
                  <path d="M0 0 Q16 -6 30 6 Q15 -1 0 3 Z" transform="rotate(-36)"/>
                  <path d="M0 0 Q16 -6 30 6 Q15 -1 0 3 Z" transform="rotate(4)"/>
                  <path d="M0 0 Q16 -6 30 6 Q15 -1 0 3 Z" transform="rotate(42)"/>
                </g>
                <g transform="scale(-1,1)">
                  <path d="M0 0 Q16 -6 30 6 Q15 -1 0 3 Z" transform="rotate(-32)"/>
                  <path d="M0 0 Q16 -6 30 6 Q15 -1 0 3 Z" transform="rotate(7)"/>
                  <path d="M0 0 Q16 -6 30 6 Q15 -1 0 3 Z" transform="rotate(45)"/>
                </g>
              </g>
              <circle cx="10" cy="18" r="3.6" fill="var(--coconut)"/>
            </g>
          </g>

          <!-- boxes waiting at the destination -->
          <g transform="translate(700 152)">
            <rect x="0" y="18" width="40" height="30" rx="5" fill="var(--box-face)"/>
            <rect x="0" y="18" width="40" height="9" rx="4" fill="var(--box-lid)"/>
            <path d="M20 18 v30" stroke="var(--box-tape)" stroke-width="3"/>
            <rect x="26" y="0" width="30" height="24" rx="5" fill="var(--box-face-2)"/>
            <rect x="26" y="0" width="30" height="7" rx="3.5" fill="var(--box-lid)"/>
          </g>
        </g>
      </svg>
    </div>
    <h1>Our Boxes</h1>
    <p class="route" id="route"></p>
    <p class="updated" id="updated">Loading…</p>
  </header>

  <div id="banner"></div>

  <section class="tiles" id="tiles" aria-label="Summary"></section>

  <div class="toolbar">
    <button class="toggle" id="viewToggle" aria-pressed="false">Table view</button>
  </div>

  <section class="cards" id="cards" aria-label="Packages"></section>

  <section class="table-wrap" id="tableView" hidden aria-label="Packages, table view">
    <table>
      <thead>
        <tr><th>Box</th><th>Status</th><th>Where it is now</th><th>Last scan</th><th>Est. delivery</th><th>Tracking #</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </section>

  <footer>
    <p id="footnote"></p>
  </footer>
</div>

<script>
const ICON = {
  check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8.5l3.5 3.5 7.5-8"/></svg>',
  truck: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 4.5h8v7H1zM9 7h3l2 2.5v2h-5z"/><circle cx="4" cy="12.5" r="1.4"/><circle cx="11.5" cy="12.5" r="1.4"/></svg>',
  box: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.6l6 3v6.8l-6 3-6-3V4.6z"/><path d="M2 4.6l6 3 6-3M8 7.6v6.8"/></svg>',
  home: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7l6-5 6 5v7H2z"/></svg>',
  alert: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8L15 14H1z"/><path d="M8 6.2v3.4M8 11.8v.05"/></svg>',
};

// stage: 0 label created, 1 in transit, 2 out for delivery, 3 delivered, -1 exception
const STATUS = {
  pre_transit:          { stage: 0, label: "Label created",   icon: "box",   color: "var(--muted)" },
  in_transit:           { stage: 1, label: "On the way",      icon: "truck", color: "var(--progress)" },
  out_for_delivery:     { stage: 2, label: "Out for delivery",icon: "truck", color: "var(--progress)" },
  available_for_pickup: { stage: 2, label: "Ready for pickup",icon: "home",  color: "var(--progress)" },
  delivered:            { stage: 3, label: "Delivered",       icon: "check", color: "var(--good)" },
  return_to_sender:     { stage: -1, label: "Returning to sender", icon: "alert", color: "var(--critical)" },
  failure:              { stage: -1, label: "Problem",        icon: "alert", color: "var(--critical)" },
  cancelled:            { stage: -1, label: "Cancelled",      icon: "alert", color: "var(--critical)" },
  error:                { stage: -1, label: "Couldn't check", icon: "alert", color: "var(--critical)" },
  unknown:              { stage: 0,  label: "Not scanned yet",icon: "box",   color: "var(--muted)" },
};
const STAGE_NAMES = ["Label", "On the way", "Almost there", "Delivered"];

const meta = (s) => STATUS[s] || STATUS.unknown;
const titleCase = (s) =>
  s ? s.toLowerCase().replace(/\b[a-z]/g, (c) => c.toUpperCase()) : "";

function place(ev) {
  if (!ev) return null;
  const city = titleCase(ev.city);
  const parts = [city, ev.state].filter(Boolean);
  return parts.length ? parts.join(", ") : null;
}

function fmtDateTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleString(undefined, {
    month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
  });
}
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleString(undefined, { hour: "numeric", minute: "2-digit" });
}
function fmtDay(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function fmtEta(p) {
  // Prefer the carrier's local calendar date so a UTC midnight ETA never shifts a day.
  const raw = p.estDeliveryLocal || p.estDelivery;
  if (!raw) return null;
  const d = p.estDeliveryLocal
    ? new Date(p.estDeliveryLocal + "T12:00:00")
    : new Date(p.estDelivery);
  if (isNaN(d)) return null;
  return d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
}

function chip(p) {
  const m = meta(p.status);
  return `<span class="chip" style="color:${m.color}">${ICON[m.icon]}${m.label}</span>`;
}

function meterHtml(p) {
  const m = meta(p.status);
  let segs = "";
  for (let i = 0; i < 4; i++) {
    let cls = "seg";
    if (m.stage === -1) cls += i === 0 ? " bad" : "";
    else if (m.stage === 3) cls += " done";
    else if (i <= m.stage) cls += " on";
    segs += `<div class="${cls}"></div>`;
  }
  const names = STAGE_NAMES.map(
    (n, i) => `<span class="${i === m.stage ? "cur" : ""}">${n}</span>`
  ).join("");
  return `<div><div class="meter" role="img" aria-label="Stage: ${m.label}">${segs}</div>
          <div class="stages" aria-hidden="true">${names}</div></div>`;
}

function timelineHtml(p) {
  if (!p.events || !p.events.length) return "";
  const rows = [...p.events].reverse().map((ev) => {
    const loc = place(ev);
    return `<li>
      <time datetime="${ev.datetime || ""}">${fmtDay(ev.datetimeLocal || ev.datetime)}<br>${fmtTime(ev.datetimeLocal || ev.datetime)}</time>
      <div><div class="msg">${ev.message || ""}</div>${loc ? `<div class="loc">${loc}</div>` : ""}</div>
    </li>`;
  }).join("");
  return `<details><summary>Full history (${p.events.length} scans)</summary>
            <ul class="events">${rows}</ul></details>`;
}

function cardHtml(p) {
  const ev = p.lastEvent;
  const loc = place(ev);
  const eta = fmtEta(p);
  const m = meta(p.status);

  const nowBlock = p.status === "error"
    ? `<div class="now"><div class="where" style="color:var(--critical)">Couldn't refresh this box</div>
         <div class="what">${p.error || "Lookup failed."} Try the FedEx link below.</div></div>`
    : `<div class="now">
         <div class="where">${loc || "Not scanned yet"}</div>
         <div class="what">${ev && ev.message ? ev.message : "Waiting for the first scan."}</div>
         ${ev ? `<div class="when">${fmtDateTime(ev.datetimeLocal || ev.datetime)}</div>` : ""}
         <div class="eta-line">${eta ? `Arriving <b>${eta}</b>` : "Estimated delivery not set yet"}</div>
       </div>`;

  return `<article class="card">
    <div class="card-top">
      <div>
        <h2 class="nickname">${p.nickname}</h2>
        <div class="tracking"><a href="${p.trackerUrl}" target="_blank" rel="noopener">${p.trackingCode}</a></div>
      </div>
      ${chip(p)}
    </div>
    ${m.stage === -1 && p.status !== "error" ? "" : meterHtml(p)}
    ${nowBlock}
    ${timelineHtml(p)}
  </article>`;
}

function tilesHtml(d) {
  const ps = d.packages;
  const count = (fn) => ps.filter(fn).length;
  const delivered = count((p) => p.status === "delivered");
  const moving = count((p) => p.status === "in_transit" || p.status === "out_for_delivery");
  const waiting = count((p) => p.status === "pre_transit" || p.status === "unknown");
  const problems = count((p) => meta(p.status).stage === -1);

  // Latest ETA across boxes = when the whole shipment should be complete.
  const etas = ps.map((p) => p.estDeliveryLocal || (p.estDelivery || "").slice(0, 10)).filter(Boolean);
  const lastEta = etas.length ? [...etas].sort().at(-1) : null;
  const etaText = lastEta
    ? new Date(lastEta + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })
    : "Not set yet";
  const missing = ps.length - etas.length;
  const etaSub = !etas.length
    ? "No estimates yet"
    : missing
      ? `${missing} still without an estimate`
      : "All boxes";

  const tiles = [
    { label: "Boxes", value: ps.length, sub: "In this shipment" },
    { label: "Delivered", value: delivered, sub: delivered === ps.length ? "All arrived" : `${ps.length - delivered} still out` },
    { label: "On the way", value: moving, sub: waiting ? `${waiting} not picked up yet` : "Moving now" },
    { label: "Last arrival", value: etaText, sub: etaSub },
  ];
  if (problems) tiles.push({ label: "Needs attention", value: problems, sub: "See cards below" });

  return tiles.map((t) => `<div class="tile">
      <div class="label">${t.label}</div>
      <div class="value">${t.value}</div>
      <div class="sub">${t.sub}</div>
    </div>`).join("");
}

function tableHtml(d) {
  return d.packages.map((p) => {
    const ev = p.lastEvent;
    const eta = fmtEta(p);
    return `<tr>
      <td>${p.nickname}</td>
      <td>${meta(p.status).label}</td>
      <td>${place(ev) || "—"}</td>
      <td class="scan">${ev ? `${ev.message} · ${fmtDateTime(ev.datetimeLocal || ev.datetime)}` : "—"}</td>
      <td>${eta || "—"}</td>
      <td class="num">${p.trackingCode}</td>
    </tr>`;
  }).join("");
}

function render(d) {
  document.getElementById("route").innerHTML = d.origin && d.destination
    ? `<span>${d.origin}</span><span class="arrow">to</span><span>${d.destination}</span>`
    : "";

  const gen = d.generatedAt ? new Date(d.generatedAt) : null;
  document.getElementById("updated").textContent = gen
    ? `Updated ${gen.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}`
    : "";

  if (d.failedCount > 0) {
    document.getElementById("banner").innerHTML =
      `<div class="banner">${ICON.alert} Couldn't refresh ${d.failedCount} of ${d.packages.length} boxes on the last check. Those cards show their last known state.</div>`;
  }

  document.getElementById("tiles").innerHTML = tilesHtml(d);
  document.getElementById("cards").innerHTML = d.packages.map(cardHtml).join("");
  document.getElementById("tableBody").innerHTML = tableHtml(d);
  document.getElementById("footnote").innerHTML =
    `Refreshed automatically every 30 minutes from FedEx tracking. ` +
    `Shipment request ${d.shipmentRequestId || "—"}. Tap a tracking number for the full FedEx page.`;
}

const toggle = document.getElementById("viewToggle");
toggle.addEventListener("click", () => {
  const showTable = document.getElementById("cards").hasAttribute("hidden") === false;
  document.getElementById("cards").toggleAttribute("hidden", showTable);
  document.getElementById("tableView").toggleAttribute("hidden", !showTable);
  toggle.textContent = showTable ? "Card view" : "Table view";
  toggle.setAttribute("aria-pressed", String(showTable));
});

fetch("data/tracking.json?t=" + Date.now())
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(render)
  .catch((err) => {
    document.getElementById("updated").textContent = "";
    document.getElementById("banner").innerHTML =
      `<div class="banner">${ICON.alert} Couldn't load tracking data (${err.message}).</div>`;
  });
</script>
</body>
</html>
